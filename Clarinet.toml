[project]
name = "deadman-protocol"
description = ""
authors = []
telemetry = true
cache_dir = "./.cache"

[contracts.vault-core]
path = "contracts/vault-core.clar"
clarity_version = 2
epoch = "2.5"

[contracts.condition-engine]
path = "contracts/condition-engine.clar"
clarity_version = 2
epoch = "2.5"

[contracts.delegation-registry]
path = "contracts/delegation-registry.clar"
clarity_version = 2
epoch = "2.5"

[contracts.activity-tracker]
path = "contracts/activity-tracker.clar"
clarity_version = 2
epoch = "2.5"

[contracts.release-handler]
path = "contracts/release-handler.clar"
clarity_version = 2
epoch = "2.5"

[contracts.admin-config]
path = "contracts/admin-config.clar"
clarity_version = 2
epoch = "2.5"

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }

# Check-checker settings:
# trusted_sender: if true, inputs are trusted after tx_sender has been checked.
# trusted_caller: if true, inputs are trusted after contract-caller has been checked.
# callee_filter: if true, untrusted data may be passed into a private function without a
# warning, if it gets checked inside. This check will also propagate up to the
# caller.
# More informations: https://www.hiro.so/blog/new-safety-checks-in-clarinet
